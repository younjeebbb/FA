<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUCKING A.D.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a2a2a;--panel:#363636;--ink:#fff;--mute:#b8b8b8;--line:#505050;--acc:#fdebb4;--accfg:#2a1008;--ok:#7fd1a4;--no:#ff8a80;--back:#46433a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Noto Sans KR',system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{display:flex;align-items:center;gap:10px;font-size:18px;cursor:pointer}header b img{height:44px;width:auto}#who{display:flex;align-items:center;gap:8px}#who .av{width:32px;height:32px;font-size:14px}
main{max-width:720px;margin:0 auto;padding:20px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.ghost{color:var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h2{margin:0;font-size:22px}h3{margin:0;font-size:18px}
.ch{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.ch-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ch-h span{color:var(--mute);font-size:14px}
.meter{height:6px;background:var(--line);border-radius:3px;margin:10px 0 12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--mute);padding:32px 0;text-align:center}
.users{display:grid;gap:10px;margin:20px 0}
.users div{display:flex;gap:8px;align-items:center}.avb{padding:0;border:0;background:none;border-radius:50%;flex:none;cursor:pointer}.avb:hover{outline:2px solid var(--acc)}.av{color:var(--mute);width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.users .big{flex:1;padding:18px;font-size:18px;text-align:left}
label{display:block;font-weight:500;margin:14px 0 6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:220px;resize:vertical}
details{color:var(--mute);font-size:14px;margin:8px 0}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;color:var(--ink)}
.pv{margin:12px 0;color:var(--mute);font-size:14px}
.pv li{margin:4px 0}.pv b{color:var(--ink)}
.count{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:280px;padding:28px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:background .2s,transform .2s;user-select:none}
.card.flip{background:var(--back);transform:rotateX(4deg)}
.card small{color:var(--mute);margin-bottom:10px}
.card div{font-size:20px;white-space:pre-wrap;word-break:keep-all}
.act{display:flex;gap:10px;margin-top:14px}
.act button{flex:1;padding:14px}
.act .k{border-color:var(--ok);color:var(--ok)}.act .u{border-color:var(--no);color:var(--no)}
.hint{color:var(--mute);font-size:13px;text-align:center;margin-top:10px}
footer{max-width:720px;margin:0 auto;padding:8px 20px 40px;display:flex;gap:8px;flex-wrap:wrap}
.rk{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.rk .av{width:36px;height:36px;font-size:14px}.rk .rn{width:40px;font-weight:700}.rk .nm{flex:1}.rk.me{border-color:var(--acc)}.rk small{color:var(--mute)}
select{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.qn{color:var(--mute);font-size:14px;margin-bottom:4px}
.shown{margin:10px 0 12px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--bg);white-space:pre-wrap}
.ck{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--acc)}.ck:has(input:checked){border-color:var(--acc)}
.sticky{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.ex{white-space:pre-wrap;margin:10px 0 0;color:var(--ok)}.ex small{color:var(--mute)}
.wr{white-space:pre-wrap;margin:10px 0 0}.wr small{color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;background:none}.seg button.on{background:var(--acc);color:var(--accfg)}
.stage{position:relative;touch-action:none;border-radius:8px;overflow:hidden;border:1px solid var(--line);user-select:none;-webkit-user-select:none;cursor:crosshair}
.stage img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none}
.bx{position:absolute;border:2px solid var(--acc);background:rgba(253,235,180,.35);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);font-size:clamp(12px,3vw,22px)}
.bx.cover{background:var(--acc);color:var(--accfg);border-color:var(--accfg)}
.bx.ok{border-color:var(--ok);background:rgba(127,209,164,.3)}.bx.no{border-color:var(--no);background:rgba(255,138,128,.3)}
.arow{display:flex;align-items:center;gap:8px;margin:8px 0}.arow b{width:30px}.arow input{flex:1}.arow span{flex:1;white-space:pre-wrap}
.pqg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:560px){.pqg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card.flip{transform:none}}
</style>
</head>

<script>
const $=s=>document.querySelector(s), app=$('#app');
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('저장에 실패했어요. 브라우저 저장 공간을 확인해 주세요.')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let x=5381;for(const c of s)x=((x<<5)+x+c.charCodeAt(0))|0;return (x>>>0).toString(36)};

const blank=()=>[0,1,2].map(i=>({name:'이용자 '+(i+1),photo:'',progress:{}}));
let U=load('fc_U',null);
if(!U){
  U=blank();const ou=load('fc_users',null),op=load('fc_photos',{}),d0=[];
  U.forEach((u,i)=>{if(ou&&ou[i])u.name=ou[i];if(op[i])u.photo=op[i];u.progress=load('fc_prog_'+i,{});if(u.photo||Object.keys(u.progress).length)d0.push(i)});
  save('fc_U',U);save('fc_dirty',d0);
}
U.forEach(u=>{u.exam=u.exam||null});
let cur=load('fc_cur',null);
let decks=load('fc_decks',[]);
const prog=()=>U[cur].progress;
let S=null, view='home', note='', busy=false;
let pi=0,pt=null,E=null,order=load('fc_order','shuffle'),Q=null,pqs=load('fc_pq',[]),imgs={},pqState={},imgBusy={};
const avatar=(i,btn)=>{
  const ph=U[i].photo;
  if(!btn)return ph?`<img class="av" src="${ph}" alt="">`:'';
  return `<button class="avb" data-act="photo" data-i="${i}" aria-label="프로필 사진 변경">${ph?`<img class="av" src="${ph}" alt="">`:'<span class="av">+</span>'}</button>`;
};

/* ---------- 공유 저장소: Firebase Realtime Database (REST) ---------- */
const DB_URL='https://fucking-ad-default-rtdb.asia-southeast1.firebasedatabase.app';  // ← 여기에 Firebase Realtime Database 주소를 붙여넣으세요 (예: https://내프로젝트-default-rtdb.firebaseio.com)
const dbUrl=()=>(load('fc_db','')||DB_URL).trim().replace(/\/+$/,'');
async function dbReq(method,body,path=''){
  const u=dbUrl();if(!u)throw new Error('no-db');
  const r=await fetch(u+'/'+path+'.json',{method,cache:'no-store',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
  if(!r.ok)throw new Error('서버 오류 ('+r.status+')');
  return r.json();
}
let fp=null;
function send(map){const q=load('fc_pending',[]);q.push(map);save('fc_pending',q);flush()}
function flush(){
  if(fp||!dbUrl())return fp||Promise.resolve();
  fp=(async()=>{
    try{for(;;){
      const q=load('fc_pending',[]);if(!q.length)break;
      await dbReq('PATCH',q[0]);
      const q2=load('fc_pending',[]);q2.shift();save('fc_pending',q2);
    }}catch(e){}
  })().then(()=>{fp=null});
  return fp;
}
async function pull(){
  if(!dbUrl())return;
  await flush();
  if(load('fc_pending',[]).length)return;
  const [dk,us0,pq]=await Promise.all(['decks','users','pq'].map(x=>dbReq('GET',undefined,x)));
  const db={decks:dk,users:us0,pq};
  const mine=U.some(u=>u.photo||Object.keys(u.progress).length);
  if(!db.decks&&!db.users&&!db.pq&&(decks.length||mine)){
    const m={};
    decks.forEach(d=>{m[`decks/${d.id}/name`]=d.name;m[`decks/${d.id}/o`]=d.o||Date.now();d.cards.forEach((c,k)=>m[`decks/${d.id}/cards/${c.id}`]={q:c.q,a:c.a,o:c.o||k})});
    U.forEach((u,i)=>{m[`users/${i}/name`]=u.name;if(u.photo)m[`users/${i}/photo`]=u.photo;Object.entries(u.progress).forEach(([k,v])=>m[`users/${i}/progress/${k}`]=v);if(u.exam)m[`users/${i}/exam`]=u.exam});
    send(m);return;
  }
  decks=Object.entries(db.decks||{}).map(([id,d])=>({id,name:d.name||'(이름 없음)',o:d.o||0,cards:Object.entries(d.cards||{}).map(([cid,c])=>({id:cid,q:c.q,a:c.a,o:c.o||0})).sort((x,y)=>x.o-y.o)})).sort((x,y)=>x.o-y.o);
  save('fc_decks',decks);
  pqs=Object.entries(db.pq||{}).map(([id,v])=>({id,o:v.o||0,boxes:v.boxes||[]})).sort((a,b)=>a.o-b.o);save('fc_pq',pqs);
  const us=db.users||{};
  for(let i=0;i<3;i++){const r=us[i];if(r)U[i]={name:r.name||U[i].name,photo:r.photo||'',progress:r.progress||{},exam:r.exam||null}}
  save('fc_U',U);
}
async function sync(){
  busy=true;render();
  try{await pull();note=''}
  catch(e){note=(e.message==='no-db'?'':'불러오지 못했어요. ')+'저장된 사본을 보여드려요.'}
  busy=false;render();
}

/* ---------- 텍스트 → 문제/정답 자동 분류 ---------- */
function parseTSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}
      else cell+=c;
    }else if(c==='"'&&cell===''){q=true}
    else if(c==='\t'){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else if(c!=='\r')cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows;
}
const oxOf=a=>{
  const m=String(a).match(/^\s*(답\s*[:：]\s*)?([OoXx○×])(?=\s|$|[(（,，.])/);
  if(!m)return null;
  if(!m[1]&&!/^\s*[OoXx○×]\s*(?:[(（]|$|\n)/.test(a))return null;
  return /[Oo○]/.test(m[2])?'O':'X';
};
function parse(text){
  const lines=text.replace(/\r/g,'').split('\n');
  const qRe=/^\s*(?:\d+\s*[.)]\s*)?(?:Q|문제|질문)\s*\d*\s*[:：.)]\s*/i;
  const aRe=/^\s*(?:A|정답|답)\s*[:：]\s*/i;
  const cards=[];
  const push=(q,a)=>{q=q.trim();a=a.trim();if(q&&a)cards.push({q,a})};

  // 0) 엑셀/구글시트에서 복사한 두 열 (문제 [탭] 답), 답 칸 안의 줄바꿈 허용
  if(text.includes('\t')){
    const rows=parseTSV(text).filter(r=>r.join('').trim());
    const two=rows.filter(r=>r.length>=2&&r[0].trim()&&r.slice(1).join('').trim());
    if(two.length&&two.length>=rows.length/2){
      for(const r of rows){
        if(r.length>=2&&r[0].trim())push(r[0],r.slice(1).map(x=>x.replace(/[ \t]+$/gm,'').trim()).filter(Boolean).join('\n').replace(/\n{3,}/g,'\n\n'));
        else if(r.length===1&&cards.length)cards[cards.length-1].a+='\n'+r[0].trim();
      }
      return cards;
    }
  }

  // 1) Q:/A:, 문제:/정답: 형식
  if(lines.some(l=>qRe.test(l))&&lines.some(l=>aRe.test(l))){
    let q=null,a=null,m='';
    for(const l of lines){
      if(qRe.test(l)){if(q!==null)push(q,a||'');q=l.replace(qRe,'');a='';m='q'}
      else if(aRe.test(l)&&q!==null){a=l.replace(aRe,'');m='a'}
      else if(q!==null){if(m==='a')a+='\n'+l;else q+='\n'+l}
    }
    if(q!==null)push(q,a||'');
    return cards;
  }
  // 2) 한 줄에 구분자(탭, ::, |, =>, →, " - ")
  const sepRe=/\t|::|\s\|\s|=>|→|\s-\s/;
  const nonEmpty=lines.filter(l=>l.trim());
  if(nonEmpty.length&&nonEmpty.filter(l=>sepRe.test(l)).length>=nonEmpty.length/2){
    let last=null;
    for(const l of nonEmpty){
      const m=l.match(sepRe);
      if(m){const i=m.index;last={q:l.slice(0,i).replace(/^\s*\d+\s*[.)]\s*/,''),a:l.slice(i+m[0].length)};cards.push(last)}
      else if(last)last.a+='\n'+l.trim();
    }
    return cards.map(c=>({q:c.q.trim(),a:c.a.trim()})).filter(c=>c.q&&c.a);
  }
  // 3) 빈 줄로 구분된 블록: 첫 줄 = 문제, 나머지 = 정답
  for(const b of text.replace(/\r/g,'').split(/\n\s*\n/)){
    const ls=b.split('\n').map(x=>x.trim()).filter(Boolean);
    if(ls.length>=2)push(ls[0].replace(/^\d+\s*[.)]\s*/,''),ls.slice(1).map(x=>x.replace(/^[-•·]\s*/,'')).join('\n'));
  }
  return cards;
}

const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function ranks(){
  const r=U.map((u,i)=>({i,e:u.exam})).sort((a,b)=>!a.e?(b.e?1:0):!b.e?-1:b.e.s-a.e.s||a.e.ts-b.e.ts);
  let rank=0,prev=null;
  return r.map((x,k)=>{
    if(x.e&&(prev===null||x.e.s!==prev))rank=k+1;
    if(x.e)prev=x.e.s;
    const u=U[x.i];
    return `<div class="rk${x.i===cur?' me':''}"><span class="rn">${x.e?rank+'위':'-'}</span>${u.photo?`<img class="av" src="${u.photo}" alt="">`:`<span class="av">${esc(u.name.slice(0,1))}</span>`}<span class="nm">${esc(u.name)}</span><span>${x.e?`<b>${x.e.s}점</b> <small>/ ${x.e.t}문제</small>`:'<small>아직 응시 안 함</small>'}</span></div>`;

function startExam(){
  if(U[cur].exam)return alert('이미 응시했어요. 시험은 한 번만 볼 수 있어요.');
  const sv=load('fc_exam_'+cur,null);
  if(sv){E={items:sv.items,ans:sv.ans,phase:'run'};return render()}
  const sc=$('#sc').value;
  const all=decks.flatMap(d=>d.cards.map(c=>({q:c.q,a:c.a,d:d.id})));
  const pool=sc==='all'?all:all.filter(c=>c.d===sc);
  if(!pool.length)return alert('시험을 볼 카드가 없어요.');
  const items=shuffle(pool).slice(0,20).map(c=>{
    const ox=oxOf(c.a);
    if(ox)return{q:c.q,a:c.a,ox:true,isTrue:ox==='O'};
    let shown=c.a,isTrue=true;
    if(Math.random()<.5){
      const pl=all.filter(x=>!oxOf(x.a)&&x.a!==c.a);
      let cand=pl.filter(x=>x.d===c.d);
      if(!cand.length)cand=pl;
      if(cand.length){shown=cand[Math.floor(Math.random()*cand.length)].a;isTrue=false}
    }
    return{q:c.q,a:c.a,shown,isTrue};
  });
  E={items,ans:items.map(()=>null),phase:'run'};
  save('fc_exam_'+cur,{items,ans:E.ans});render();
}

function startStudy(id,m){
  const d=decks.find(x=>x.id===id),p=prog();
  let q=d.cards.filter(c=>m==='all'||p[c.id]!==1);
  if(!q.length){alert('모든 카드를 외웠어요! 전체 학습으로 복습해 보세요.');return}
  if(order==='shuffle')q=shuffle(q);
  S={deck:d,queue:q,i:0,flip:false,k:0,u:0,order};view='study';render();
}
function mark(v){
  const c=S.queue[S.i],p=prog();p[c.id]=v;save('fc_U',U);send({[`users/${cur}/progress/${c.id}`]:v});
  v===1?S.k++:S.u++;S.i++;S.flip=false;render();
}
app.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,i=+t.dataset.i;
  if(a==='user'){cur=i;save('fc_cur',cur);view='home';render()}
  else if(a==='photo'){pi=i;$('#pf').click()}
  else if(a==='rename'){const n=prompt('이름을 입력하세요',U[i].name);if(n&&n.trim()){U[i].name=n.trim();save('fc_U',U);send({[`users/${i}/name`]:U[i].name});render()}}
  else if(a==='add'){view='add';render()}
  else if(a==='home'){view='home';render()}
  else if(a==='study')startStudy(id,t.dataset.m);
  else if(a==='exam'){view='exam';E=null;render();try{await pull();if(view==='exam'&&!E)render()}catch(err){}}
  else if(a==='exstart')startExam();
  else if(a==='exsubmit')submitExam();
  else if(a==='pq'){Q=null;view='pq';render();try{await pull();if(view==='pq')render()}catch(err){}}
  else if(a==='pqnew'){Q={img:'',boxes:[]};view='pqedit';render()}
  else if(a==='pqundo'){Q.boxes.pop();pqBoxes()}
  else if(a==='pqclear'){Q.boxes=[];pqBoxes()}
  else if(a==='pqsave'){
    if(!Q.img||!Q.boxes.length)return alert('사진 위에 가릴 곳을 한 개 이상 그려 주세요.');
    if(Q.boxes.some(b=>!b.a.trim()))return alert('모든 박스에 정답을 적어 주세요.');
    const id='p'+Date.now().toString(36),r=n=>Math.round(n*10000)/10000;
    const meta={o:Date.now(),boxes:Q.boxes.map(b=>({x:r(b.x),y:r(b.y),w:r(b.w),h:r(b.h),a:b.a.trim()}))};
    pqs.push({id,...meta});save('fc_pq',pqs);imgs[id]=Q.img;
    send({['pq/'+id]:meta,['pqimg/'+id]:Q.img});
    Q=null;view='pq';render();
  }
  else if(a==='pqdel'){if(confirm('이 그림 퀴즈를 삭제할까요? 모든 이용자에게서 사라져요.')){pqs=pqs.filter(x=>x.id!==id);delete pqState[id];save('fc_pq',pqs);send({['pq/'+id]:null,['pqimg/'+id]:null});render()}}
  else if(a==='pqgrade'){pqSt(id).done=true;pqRefresh(id)}
  else if(a==='pqfix'){pqSt(id).fix[i]=true;pqRefresh(id)}
  else if(a==='pqretry'){pqState[id]={ans:[],done:false,fix:[]};pqRefresh(id)}
  else if(a==='order'){order=t.dataset.v;save('fc_order',order);render()}
  else if(a==='flip'){S.flip=!S.flip;render()}
  else if(a==='mark')mark(+t.dataset.v);
  else if(a==='reset'){if(confirm('내 진행도만 초기화할까요? 다른 이용자에겐 영향 없어요.')){const p=prog(),d=decks.find(x=>x.id===id),m={};d.cards.forEach(c=>{delete p[c.id];m[`users/${cur}/progress/${c.id}`]=null});save('fc_U',U);send(m);render()}}
  else if(a==='del'){if(confirm('이 단원을 삭제할까요? 모든 이용자에게서 사라져요.')){decks=decks.filter(x=>x.id!==id);save('fc_decks',decks);send({['decks/'+id]:null});render()}}
  else if(a==='saveadd'){
    const name=$('#nm').value.trim(),cs=parse($('#tx').value);
    if(!name)return alert('단원 이름을 입력해 주세요.');
    if(!cs.length)return alert('분류된 카드가 없어요.');
    t.disabled=true;t.textContent='저장 중…';
    try{await pull()}catch(err){}
    let x=decks.find(y=>y.name===name);const m={};
    if(!x){x={id:'d'+Date.now().toString(36),name,o:Date.now(),cards:[]};decks.push(x);m[`decks/${x.id}/name`]=name;m[`decks/${x.id}/o`]=x.o}
    const have=new Set(x.cards.map(c=>c.q)),base=Date.now();let k=0;
    for(const c of cs)if(!have.has(c.q)){const id=x.id+'_'+hash(c.q),o=base+(k++);x.cards.push({id,q:c.q,a:c.a,o});have.add(c.q);m[`decks/${x.id}/cards/${id}`]={q:c.q,a:c.a,o}}
    save('fc_decks',decks);send(m);view='home';render();
  }
});
app.addEventListener('change',e=>{
  if(e.target.dataset.k!==undefined&&E&&E.phase==='run'){
    const k=+e.target.dataset.k,v=e.target.dataset.v==='1';
    if(e.target.checked){E.ans[k]=v;app.querySelectorAll(`input[data-k="${k}"]`).forEach(c=>{if(c!==e.target)c.checked=false})}else E.ans[k]=null;
    save('fc_exam_'+cur,{items:E.items,ans:E.ans});
    $('#pg').textContent=E.ans.filter(a=>a!==null).length+' / '+E.items.length+' 풀었어요';
    return;
  }
  if(e.target.id==='pimg'&&e.target.files[0]&&Q){
    const img=new Image(),u=URL.createObjectURL(e.target.files[0]);
    img.onload=()=>{const m=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      Q.img=c.toDataURL('image/jpeg',.8);Q.boxes=[];URL.revokeObjectURL(u);pqStage()};
    img.src=u;return;
  }
  if(e.target.id!=='pf'||!e.target.files[0])return;
  const img=new Image(),u=URL.createObjectURL(e.target.files[0]);
  img.onload=()=>{const n=160,c=document.createElement('canvas');c.width=c.height=n;const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,n,n);
    U[pi].photo=c.toDataURL('image/jpeg',.85);save('fc_U',U);send({[`users/${pi}/photo`]:U[pi].photo});URL.revokeObjectURL(u);render()};
  img.src=u;
});
app.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.pa!==undefined&&Q)Q.boxes[+d.pa].a=e.target.value;
  else if(d.sa!==undefined)pqSt(d.q).ans[+d.sa]=e.target.value;
});
$('#who').addEventListener('click',e=>{if(e.target.dataset.act==='switch'){cur=null;save('fc_cur',null);view='home';render()}});
const goMain=()=>{cur=null;save('fc_cur',null);view='home';E=null;S=null;render();window.scrollTo(0,0)};
$('#logo').addEventListener('click',goMain);
$('#logo').addEventListener('keydown',e=>{if(e.key==='Enter')goMain()});
document.addEventListener('keydown',e=>{
  if(view!=='study'||!S||S.i>=S.queue.length||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();S.flip=!S.flip;render()}
  else if(S.flip&&e.key==='ArrowRight')mark(1);
  else if(S.flip&&e.key==='ArrowLeft')mark(2);
});

/* ---------- 관리자 설정 ---------- */
$('#rel').onclick=sync;
$('#adm').onclick=()=>{
  const v=prompt('동기화 주소 (Firebase Realtime Database URL)',dbUrl());
  if(v===null)return;
  save('fc_db',v.trim());sync();
};
window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view!=='study'&&view!=='pqedit'&&view!=='pq'&&!(view==='exam'&&E))sync()});
render();
sync();
</script>
</body>
</html>
